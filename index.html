<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ماشین حساب</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#222222">
<style>
  * { box-sizing: border-box; font-family: sans-serif; }
  body { margin: 0; background: #222; color: #fff; height: 100vh;
         display: flex; flex-direction: column; justify-content: flex-end; }
  #screen { padding: 20px; text-align: left; direction: ltr;
            font-size: 48px; min-height: 120px; word-break: break-all;
            display: flex; align-items: flex-end; justify-content: flex-end; }
  #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
          background: #444; direction: ltr; }
  button { border: 0; background: #333; color: #fff; font-size: 28px;
           padding: 24px 0; }
  button:active { background: #555; }
  .op { background: #f39c12; }
  .op:active { background: #d68910; }
  .clr { background: #c0392b; }
</style>
</head>
<body>
<div id="screen">0</div>
<div id="grid">
  <button class="clr" onclick="clr()">C</button>
  <button onclick="back()">⌫</button>
  <button class="op" onclick="add('%')">%</button>
  <button class="op" onclick="add('/')">÷</button>
  <button onclick="add('7')">7</button>
  <button onclick="add('8')">8</button>
  <button onclick="add('9')">9</button>
  <button class="op" onclick="add('*')">×</button>
  <button onclick="add('4')">4</button>
  <button onclick="add('5')">5</button>
  <button onclick="add('6')">6</button>
  <button class="op" onclick="add('-')">−</button>
  <button onclick="add('1')">1</button>
  <button onclick="add('2')">2</button>
  <button onclick="add('3')">3</button>
  <button class="op" onclick="add('+')">+</button>
  <button onclick="add('0')">0</button>
  <button onclick="add('.')">.</button>
  <button class="op" style="grid-column: span 2" onclick="calc()">=</button>
</div>
<script>
let expr = '';
const screen = document.getElementById('screen');
function show(t) { screen.textContent = t === '' ? '0' : t; }
function add(c) { expr += c; show(expr); }
function clr() { expr = ''; show(''); }
function back() { expr = expr.slice(0, -1); show(expr); }
function calc() {
  if (!/^[0-9+\-*\/.%() ]+$/.test(expr)) return;
  try {
    const r = Function('"use strict"; return (' + expr + ')')();
    if (!isFinite(r)) { expr = ''; show('تقسیم بر صفر ممکن نیست'); return; }
    expr = String(Math.round(r * 1e10) / 1e10);
    show(expr);
  } catch (e) { expr = ''; show('خطا'); }
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
